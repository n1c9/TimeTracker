/* App custom styles */
:root { --surface:#fff; --surface-alt:#f8fafc; --text:#1e293b; --text-muted:#64748b; --border:#e2e8f0; --primary:#4f46e5; --primary-fg:#fff; --hover:#f1f5f9; --danger:#ef4444; }
.dark { --surface:#1e1e2e; --surface-alt:#181825; --text:#cdd6f4; --text-muted:#a6adc8; --border:#313244; --primary:#89b4fa; --primary-fg:#1e1e2e; --hover:#313244; --danger:#f38ba8; }
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--surface);color:var(--text)}
.bg-surface{background:var(--surface)}.bg-surface-alt{background:var(--surface-alt)}
.text-main{color:var(--text)}.text-muted{color:var(--text-muted)}
.border-main{border-color:var(--border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:background .12s,opacity .12s;white-space:nowrap}
.btn:hover{background:var(--hover)}.btn:active{opacity:.8}
.btn-primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}.btn-primary:hover{opacity:.9}
.btn-sm{padding:3px 8px;font-size:12px}.btn-icon{width:30px;height:30px;padding:0}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.input{width:100%;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 20%,transparent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ctx-menu{position:fixed;z-index:150;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:150px}
.ctx-menu button{display:block;width:100%;text-align:left;padding:7px 12px;border:none;background:none;color:var(--text);font-size:13px;border-radius:4px;cursor:pointer}
.ctx-menu button:hover{background:var(--hover)}
.ctx-menu button.danger{color:var(--danger)}
.entry-block{position:absolute;border-radius:6px;cursor:grab;overflow:hidden;transition:box-shadow .12s;touch-action:none}
.entry-block:hover{box-shadow:0 2px 12px rgba(0,0,0,.15)}
.resize-n{position:absolute;top:0;left:0;right:0;height:6px;cursor:n-resize;z-index:5}
.resize-s{position:absolute;bottom:0;left:0;right:0;height:6px;cursor:s-resize;z-index:5}
@media(pointer:coarse){.resize-n{height:14px}.resize-s{height:14px}}
.non-work-hour{background:color-mix(in srgb,var(--surface-alt) 80%,var(--border) 20%);opacity:.6}
.hour-line{border-bottom:1px solid var(--border)}
.half-line{border-bottom:1px dashed color-mix(in srgb,var(--border) 50%,transparent)}
.quarter-line{position:absolute;left:0;right:0;border-bottom:1px solid color-mix(in srgb,var(--border) 25%,transparent)}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:15;pointer-events:none}
.now-dot{position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.drag-preview{position:absolute;left:4px;right:4px;border:2px dashed var(--primary);border-radius:6px;background:color-mix(in srgb,var(--primary) 10%,transparent);pointer-events:none;z-index:20}
.selected-ring{outline:2px solid var(--primary);outline-offset:-2px}
.panel-toggle{cursor:pointer;user-select:none}
.panel-toggle .arrow{display:inline-block;transition:transform .15s;font-size:10px}
.panel-toggle.collapsed .arrow{transform:rotate(-90deg)}
.time-tooltip{position:fixed;z-index:300;background:var(--text);color:var(--surface);padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;pointer-events:none;white-space:nowrap}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text-muted) 30%,transparent);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:768px){.desktop-only{display:none!important}}
@media(min-width:769px){.mobile-only{display:none!important}}

/* Export dialog */
.export-dialog{width:100%;max-width:430px}
.export-dialog .exp-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.export-dialog .exp-row>label{font-size:13px;font-weight:500;color:var(--text-muted)}
.export-dialog .exp-radio-group{display:flex;gap:16px}
.export-dialog .exp-radio-opt{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text);cursor:pointer}
.export-dialog .exp-radio-opt input[type=radio]{accent-color:var(--primary);margin:0}
.export-dialog .exp-presets{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.export-dialog .exp-preset-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;color:var(--text);transition:all .1s}
.export-dialog .exp-preset-btn:hover{background:var(--hover)}
.export-dialog .exp-preset-btn.active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.export-dialog .exp-date-row{display:flex;gap:12px;justify-content:center;margin-bottom:6px}
.export-dialog .exp-date-field{display:flex;flex-direction:column;gap:4px}
.export-dialog .exp-date-field label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase}
.export-dialog .exp-date-field input[type=date]{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;width:155px;color:var(--text);font-family:inherit;background:var(--surface)}
.export-dialog .exp-date-field input[type=date]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 15%,transparent)}
.export-dialog .exp-date-field input.exp-error{border-color:var(--danger);box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 12%,transparent)}
.export-dialog .exp-error-msg{text-align:center;font-size:12px;color:var(--danger);margin:8px 0 12px;font-weight:500;min-height:16px}
.export-dialog .exp-list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 2px}
.export-dialog .exp-list-header .exp-hint{font-size:11px;color:var(--text-muted)}
.export-dialog .exp-list-header .exp-hint.active{color:var(--primary);font-weight:500}
.export-dialog .exp-list-header button{font-size:11px;color:var(--primary);background:none;border:none;cursor:pointer;font-weight:500;padding:0}
.export-dialog .exp-list-header button:hover{text-decoration:underline}
.export-dialog .exp-project-list{border:1px solid var(--border);border-radius:8px;max-height:180px;overflow-y:auto;margin-bottom:4px}
.export-dialog .exp-project-item{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);color:var(--text);user-select:none;transition:background .08s}
.export-dialog .exp-project-item:last-child{border-bottom:none}
.export-dialog .exp-project-item:hover{background:var(--hover)}
.export-dialog .exp-project-item.selected{background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.export-dialog .exp-check{width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;flex-shrink:0;transition:all .1s}
.export-dialog .exp-project-item.selected .exp-check{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.export-dialog .exp-shortcut-hint{font-size:10px;color:var(--text-muted);text-align:center;margin-bottom:14px;font-style:italic;opacity:.7}

/* Keyboard shortcuts modal */
.shortcuts-modal{max-width:480px}
.shortcuts-modal .shortcut-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:12px}
.shortcuts-modal .shortcut-key{font-family:ui-monospace,monospace;font-size:12px;background:var(--surface-alt);border:1px solid var(--border);border-radius:4px;padding:2px 8px;text-align:center;font-weight:500}
.shortcuts-modal .shortcut-desc{font-size:13px;color:var(--text);display:flex;align-items:center}

/* Sidebar resize handle */
#sidebar-resize-handle{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:50;background:transparent;transition:background .15s}
#sidebar-resize-handle:hover,#sidebar-resize-handle.dragging{background:color-mix(in srgb,var(--primary) 40%,transparent)}

/* Project tooltip */
.proj-tooltip{position:fixed;z-index:300;background:var(--text);color:var(--surface);font-size:11px;font-weight:500;padding:4px 8px;border-radius:5px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .12s;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.proj-tooltip.visible{opacity:1}
.csv-import-modal{max-width:560px;width:100%}
.csv-tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.csv-tab{padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.csv-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.csv-drop-zone{border:2px dashed var(--border);border-radius:8px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.csv-drop-zone:hover,.csv-drop-zone.dragover{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 5%,transparent)}
.csv-preview-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.csv-preview-table th{background:var(--surface-alt);padding:5px 8px;text-align:left;font-weight:600;border:1px solid var(--border);font-size:11px;text-transform:uppercase;color:var(--text-muted)}
.csv-preview-table td{padding:5px 8px;border:1px solid var(--border);color:var(--text)}
.csv-preview-table tr:nth-child(even) td{background:var(--surface-alt)}
.csv-error{color:var(--danger);font-size:12px;font-weight:500;margin-top:8px}
.csv-merge-opts{display:flex;gap:16px;margin-top:12px;font-size:13px}
.csv-merge-opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
.summary-chart{display:flex;align-items:flex-end;gap:3px;height:40px;padding:4px 0}
.summary-chart .chart-bar{flex:1;min-width:0;border-radius:3px 3px 0 0;transition:height .2s;position:relative}
.summary-chart .chart-bar:hover::after{content:attr(data-label);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;background:var(--text);color:var(--surface);padding:2px 6px;border-radius:3px;margin-bottom:2px}
</style>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA LAYER
// ═══════════════════════════════════════════════════════════════
const LS_KEY = 'tt_data_v2', TIMER_KEY = 'tt_timer'
const START_HOUR = 6, END_HOUR = 24
const DISPLAY_HOURS = Array.from({length: END_HOUR - START_HOUR}, (_, i) => i + START_HOUR)
const HOUR_H = 60
const MAX_TIMER_MINS = 480 // 8 hours

function uid() { return crypto.randomUUID() }
function snap15(m) { return DB.snapToGrid!==false ? Math.round(m / 15) * 15 : m }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)) }
function mToTime(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}` }
function timeToM(s) { const [h,m]=s.split(':').map(Number); return h*60+m }
function fmtDur(m) { const h=Math.floor(m/60),mn=m%60; return h?(mn?`${h}h ${mn}m`:`${h}h`):`${mn}m` }
function toISO(d) { const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}` }
function parseDate(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d) }
function addDays(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r }
function startOfWeek(d) { const r=new Date(d); r.setDate(r.getDate()-r.getDay()); return r }
function fmtDayHeader(d) { return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate() }
function fmtMonth(d) { return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}) }
function fmtFull(d) { return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}) }

let DB = loadDB()
function loadDB() {
  try { const r=localStorage.getItem(LS_KEY); if(r) return JSON.parse(r) } catch{}
  return { projects:[], templates:[], entries:[], theme:'light', view:'week', currentDate:toISO(new Date()), selProject:null, selTemplate:null, sidebarCollapsed:false, panelsCollapsed:{}, filterProject:false, snapToGrid:true }
}
function save() {
  DB.lastSaved = Date.now()
  localStorage.setItem(LS_KEY, JSON.stringify(DB))
  updateLastSavedDisplay()
}

// History
let histStack=[], futureStack=[]
function pushHist(a) { histStack.push(a); if(histStack.length>60) histStack.shift(); futureStack=[] }
function doUndo() {
  const a=histStack.pop(); if(!a) return
  futureStack.push(a)
  if(a.t==='add') DB.entries=DB.entries.filter(e=>e.id!==a.id)
  else if(a.t==='del') DB.entries.push(a.entry)
  else if(a.t==='upd') { const e=DB.entries.find(x=>x.id===a.id); if(e) Object.assign(e,a.before) }
  else if(a.t==='clearWeek') DB.entries.push(...a.entries)
  else if(a.t==='delTemplate') DB.templates.push(a.template)
  else if(a.t==='delProject') { DB.projects.push(a.project); DB.entries.push(...(a.entries||[])) }
  save(); render()
}
function doRedo() {
  const a=futureStack.pop(); if(!a) return
  histStack.push(a)
  if(a.t==='add') DB.entries.push(a.entry)
  else if(a.t==='del') DB.entries=DB.entries.filter(e=>e.id!==a.id)
  else if(a.t==='upd') { const e=DB.entries.find(x=>x.id===a.id); if(e) Object.assign(e,a.after) }
  else if(a.t==='clearWeek') { const ids=new Set(a.entries.map(x=>x.id)); DB.entries=DB.entries.filter(e=>!ids.has(e.id)) }
  else if(a.t==='delTemplate') { DB.templates=DB.templates.filter(x=>x.id!==a.template.id); DB.entries=DB.entries.filter(x=>x.taskTemplateId!==a.template.id) }
  else if(a.t==='delProject') { DB.projects=DB.projects.filter(x=>x.id!==a.project.id); if(a.entries?.length){const ids=new Set(a.entries.map(x=>x.id));DB.entries=DB.entries.filter(e=>!ids.has(e.id))} }
  save(); render()
}

function addEntry(data) {
  const entry = { id:uid(), createdAt:Date.now(), updatedAt:Date.now(), notes:'', tags:[], ...data }
  DB.entries.push(entry)
  pushHist({ t:'add', id:entry.id, entry:{...entry} })
  mergeOverlapping(entry.id)
  save(); return entry
}
function updateEntry(id, patch) {
  const e=DB.entries.find(x=>x.id===id); if(!e) return
  const before={...e}
  Object.assign(e, patch, {updatedAt:Date.now()})
  pushHist({ t:'upd', id, before, after:{...e} })
  mergeOverlapping(id)
  save()
}
function deleteEntryById(id) {
  const e=DB.entries.find(x=>x.id===id); if(!e) return
  pushHist({ t:'del', id, entry:{...e} })
  DB.entries=DB.entries.filter(x=>x.id!==id)
  save()
}

function mergeOverlapping(targetId) {
  const target = DB.entries.find(x=>x.id===targetId)
  if(!target) return false
  const overlaps = DB.entries.filter(e =>
    e.id !== targetId && e.date === target.date &&
    e.projectId === target.projectId && e.taskTemplateId === target.taskTemplateId &&
    e.startMinutes < target.endMinutes && e.endMinutes > target.startMinutes
  )
  if(!overlaps.length) return false
  for(const o of overlaps) {
    target.startMinutes = Math.min(target.startMinutes, o.startMinutes)
    target.endMinutes = Math.max(target.endMinutes, o.endMinutes)
    if(o.notes) target.notes = [target.notes, o.notes].filter(Boolean).join('\n')
    target.tags = [...new Set([...target.tags, ...o.tags])]
  }
  DB.entries = DB.entries.filter(e=>!overlaps.some(o=>o.id===e.id))
  target.updatedAt = Date.now()
  return true
}

function layoutEntries(entries) {
  if(!entries.length) return new Map()
  const sorted=[...entries].sort((a,b)=>a.startMinutes-b.startMinutes||(b.endMinutes-b.startMinutes)-(a.endMinutes-a.startMinutes))
  const groups=[]; let cur=[],end=0
  for(const e of sorted){ if(cur.length&&e.startMinutes>=end){groups.push(cur);cur=[];end=0} cur.push(e); end=Math.max(end,e.endMinutes) }
  if(cur.length) groups.push(cur)
  const map=new Map()
  for(const g of groups){
    const cols=[]
    for(const e of g){
      let placed=false
      for(let c=0;c<cols.length;c++){ if(cols[c].endMinutes<=e.startMinutes){cols[c]=e;map.set(e.id,{col:c,total:0});placed=true;break} }
      if(!placed){cols.push(e);map.set(e.id,{col:cols.length-1,total:0})}
    }
    const total=cols.length+0.35
    for(const e of g){const m=map.get(e.id);if(m)m.total=total}
  }
  return map
}

function todayHours() {
  const today = toISO(new Date())
  return DB.entries.filter(e=>e.date===today).reduce((s,e)=>s+(e.endMinutes-e.startMinutes),0)
}

function getVisibleEntries() {
  let entries = DB.entries
  if(DB.filterProject && DB.selProject) entries = entries.filter(e=>e.projectId===DB.selProject)
  return entries
}

function viewProjectTotals() {
  const dates = getViewDates()
  const entries = getVisibleEntries().filter(e=>dates.has(e.date))
  const totals = new Map()
  entries.forEach(e=>{
    const p = DB.projects.find(x=>x.id===e.projectId)
    if(!p) return
    totals.set(p.id, (totals.get(p.id)||0) + (e.endMinutes - e.startMinutes))
  })
  return totals
}

  if(dailyTotals.every(v=>v===0)) return ''
  const barH = 32
  return `<div class="flex border-b border-main bg-surface flex-shrink-0" style="height:44px;align-items:stretch">
    <div class="w-11 md:w-14 flex-shrink-0 border-r border-main" style="display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px">

function buildDayCol(dateStr, showHeader) {
  const entries = getVisibleEntries().filter(e=>e.date===dateStr)
  const layout = layoutEntries(entries)
  const d = parseDate(dateStr)
  const isToday = dateStr === toISO(new Date())
  const nowMin = (()=>{ const n=new Date(); return n.getHours()*60+n.getMinutes() })()
  const gridH = DISPLAY_HOURS.length * HOUR_H

  return `<div class="flex-1 min-w-[90px] ${showHeader?'border-r border-main last:border-r-0':''} flex flex-col" style="padding-top:8px">
    <div class="relative flex-1" style="height:${gridH}px;touch-action:none" data-date="${dateStr}" id="col-${dateStr}">
      ${DISPLAY_HOURS.map((h,i)=>`<div class="absolute w-full hour-line ${h<7||h>=17?'non-work-hour':''}" style="top:${i*HOUR_H}px;height:${HOUR_H}px"></div>`).join('')}
      ${DISPLAY_HOURS.map((h,i)=>`<div class="absolute w-full half-line" style="top:${i*HOUR_H+HOUR_H/2}px"></div><div class="quarter-line" style="top:${i*HOUR_H+HOUR_H/4}px"></div><div class="quarter-line" style="top:${i*HOUR_H+HOUR_H*3/4}px"></div>`).join('')}
      ${isToday && nowMin >= START_HOUR*60 ?`<div class="now-line" style="top:${((nowMin-START_HOUR*60)/60)*HOUR_H}px"><div class="now-dot"></div></div>`:''}
      ${entries.map(entry=>{
        const info=layout.get(entry.id)||{col:0,total:1.35}
        const top=((entry.startMinutes-START_HOUR*60)/60)*HOUR_H
        const height=Math.max(((entry.endMinutes-entry.startMinutes)/60)*HOUR_H, 15)
        const w=(1/info.total*100)+'%'
        const left=(info.col/info.total*100)+'%'
        const proj=DB.projects.find(p=>p.id===entry.projectId)
        const tmpl=DB.templates.find(t=>t.id===entry.taskTemplateId)
        const color=proj?.color||'#6b7280'
        return `<div class="entry-block" data-entry-id="${entry.id}" style="top:${top}px;height:${height}px;width:${w};left:${left};background:color-mix(in srgb,${color} 12%,var(--surface));border-left:3px solid ${color};border-top:1px solid color-mix(in srgb,${color} 30%,transparent);border-right:1px solid color-mix(in srgb,${color} 30%,transparent);border-bottom:1px solid color-mix(in srgb,${color} 30%,transparent)">
          <div class="resize-n" data-resize="top" data-entry-id="${entry.id}"></div>
          <div class="px-1.5 py-0.5 overflow-hidden h-full pointer-events-none">
            <div class="text-[11px] font-semibold truncate" style="color:${color}">${esc(proj?.name||'?')}</div>
            ${height>28?`<div class="text-[11px] text-muted truncate">${esc(tmpl?.name||'')}</div>`:''}
            ${height>42?`<div class="text-[10px] text-muted">${mToTime(entry.startMinutes)}–${mToTime(entry.endMinutes)} (${fmtDur(entry.endMinutes-entry.startMinutes)})</div>`:''}
            ${height>58&&entry.notes?`<div class="text-[10px] text-muted truncate opacity-70">📝 ${esc(entry.notes)}</div>`:''}
          </div>
          <div class="resize-s" data-resize="bottom" data-entry-id="${entry.id}"></div>
        </div>`
      }).join('')}
    </div>
  </div>`
}

function buildMonthView() {
  const cur = parseDate(DB.currentDate)
  const mStart = new Date(cur.getFullYear(), cur.getMonth(), 1)
  const calStart = startOfWeek(mStart)
  let html = `<div class="flex-1 flex flex-col p-2 overflow-auto">
    <div class="grid grid-cols-7 mb-1">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="text-center text-xs font-medium text-muted py-1">${d}</div>`).join('')}</div>
    <div class="flex-1 grid grid-rows-6 gap-1">`
  let d = new Date(calStart)
  for(let w=0;w<6;w++){
    html+='<div class="grid grid-cols-7 gap-1">'
    for(let i=0;i<7;i++){
      const iso=toISO(d), inMonth=d.getMonth()===cur.getMonth(), isToday=iso===toISO(new Date())
      const dayEntries=getVisibleEntries().filter(e=>e.date===iso)
      const total=dayEntries.reduce((s,e)=>s+(e.endMinutes-e.startMinutes),0)
      html+=`<div class="rounded-md border border-main p-1 cursor-pointer hover:bg-[var(--hover)] min-h-[50px] md:min-h-[70px] ${!inMonth?'opacity-30':''} ${isToday?'selected-ring':''}" onclick="goToDate('${iso}')">
        <div class="text-[11px] font-medium" ${isToday?'style="color:var(--primary)"':''}>${d.getDate()}</div>
        ${dayEntries.slice(0,5).map(e=>{const p=DB.projects.find(x=>x.id===e.projectId);const dur=fmtDur(e.endMinutes-e.startMinutes);return`<div class="text-[9px] truncate rounded px-0.5 mt-0.5" style="background:color-mix(in srgb,${p?.color||'#666'} 15%,transparent);color:${p?.color||'#666'}" title="${esc(p?.name||'?')} — ${mToTime(e.startMinutes)}–${mToTime(e.endMinutes)} (${dur})">${esc(p?.name||'?')}</div>`}).join('')}
        ${dayEntries.length>5?`<div class="text-[9px] text-muted">+${dayEntries.length-5}</div>`:''}
        ${total?`<div class="text-[9px] text-muted">${fmtDur(total)}</div>`:''}
      </div>`
      d = addDays(d,1)
    }
    html+='</div>'
  }
  html+='</div></div>'
  return html
}

function getDates() {
  if(DB.view==='day') return [DB.currentDate]
  const start = startOfWeek(parseDate(DB.currentDate))
  return Array.from({length:7},(_,i)=>toISO(addDays(start,i)))
}

function getViewDates() {
  if(DB.view==='day') return new Set([DB.currentDate])
  if(DB.view==='week') return new Set(getDates())
  const cur = parseDate(DB.currentDate)
  const mStart = new Date(cur.getFullYear(), cur.getMonth(), 1)
  const mEnd = new Date(cur.getFullYear(), cur.getMonth()+1, 0)
  const dates = new Set()
  let d = new Date(mStart)
  while(d <= mEnd) { dates.add(toISO(d)); d = addDays(d,1) }
  return dates
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function applyPostRender() {
  const sc = document.getElementById('cal-scroll')
  if(sc && !sc.dataset.scrolled) { sc.scrollTop = 0; sc.dataset.scrolled='1' }
  if(timerStart) updateTimerDisplay()
}

function renderPreserveScroll() {
  const sc = document.getElementById('cal-scroll')
  const scrollTop = sc ? sc.scrollTop : null
  render()
  if(scrollTop !== null) {
    const sc2 = document.getElementById('cal-scroll')
    if(sc2) { sc2.scrollTop = scrollTop; sc2.dataset.scrolled = '1' }
  }
}

let drag = null

function getMins(clientY, colEl) {
  const rect = colEl.getBoundingClientRect()
  const y = clientY - rect.top
  return snap15(clamp(Math.round(y / HOUR_H * 60) + START_HOUR*60, START_HOUR*60, END_HOUR*60))
}

function getColFromPoint(target) {
  const el = target.closest('[data-date]')
  return el ? { el, date: el.dataset.date } : null
}

function getColFromXY(x, y) {
  const el = document.elementFromPoint(x, y)?.closest('[data-date]')
  return el ? { el, date: el.dataset.date } : null
}

let longPressTimer = null
const isTouchDevice = () => 'ontouchstart' in window || navigator.maxTouchPoints > 0

// Time tooltip
function showTimeTooltip(clientX, clientY, text) {
  let tt = document.getElementById('time-tooltip')
  if(!tt) { tt = document.createElement('div'); tt.id='time-tooltip'; tt.className='time-tooltip'; document.body.appendChild(tt) }
  tt.textContent = text
  tt.style.left = (clientX + 12) + 'px'
  tt.style.top = (clientY - 20) + 'px'
  tt.style.display = ''
}
function hideTimeTooltip() {
  const tt = document.getElementById('time-tooltip')
  if(tt) tt.style.display = 'none'
}

document.addEventListener('pointerdown', function(e) {
  if(e.target.closest('.modal-bg, .ctx-menu, button, select, input, a, .btn')) return
  closeCtxMenu()
  const colInfo = getColFromPoint(e.target)
  if(!colInfo) return

  const resizeEl = e.target.closest('[data-resize]')
  const entryEl = e.target.closest('[data-entry-id]')

  if(resizeEl) {
    e.preventDefault()
    const id = resizeEl.dataset.entryId
    const entry = DB.entries.find(x=>x.id===id)
    if(!entry) return
    drag = { type:'resize', id, edge:resizeEl.dataset.resize, origStart:entry.startMinutes, origEnd:entry.endMinutes, colEl:colInfo.el }
    document.body.style.cursor = resizeEl.dataset.resize==='top'?'n-resize':'s-resize'
    showTimeTooltip(e.clientX, e.clientY, resizeEl.dataset.resize==='top'?mToTime(entry.startMinutes):mToTime(entry.endMinutes))
  } else if(entryEl) {
    const id = entryEl.dataset.entryId
    const entry = DB.entries.find(x=>x.id===id)
    if(!entry) return
    e.preventDefault()
    const forceMove = e.shiftKey
    const canCreate = !forceMove && DB.selProject && DB.selTemplate
    if(canCreate) {
      if(isTouchDevice()) {
        const clickMin = getMins(e.clientY, colInfo.el)
        drag = { type:'pending', id, clickMin, origStart:entry.startMinutes, origEnd:entry.endMinutes, origDate:entry.date, dur:entry.endMinutes-entry.startMinutes, colEl:colInfo.el, moved:false, date:colInfo.date, startMin:clickMin, curMin:clickMin }
        longPressTimer = setTimeout(()=>{
          if(drag && drag.type==='pending') { drag.type='move'; document.body.style.cursor='grabbing'; if(navigator.vibrate) navigator.vibrate(30) }
          longPressTimer = null
        }, 500)
      } else {
        const min = getMins(e.clientY, colInfo.el)
        drag = { type:'create', date:colInfo.date, startMin:min, curMin:min, colEl:colInfo.el }
        showDragPreview(colInfo.el, min, min)
        showTimeTooltip(e.clientX, e.clientY, mToTime(min))
      }
    } else {
      const clickMin = getMins(e.clientY, colInfo.el)
      drag = { type:'move', id, clickMin, origStart:entry.startMinutes, origEnd:entry.endMinutes, origDate:entry.date, dur:entry.endMinutes-entry.startMinutes, colEl:colInfo.el, moved:false }
      document.body.style.cursor = 'grabbing'
      showTimeTooltip(e.clientX, e.clientY, `${mToTime(entry.startMinutes)}–${mToTime(entry.endMinutes)}`)
    }
  } else {
    if(!DB.selProject || !DB.selTemplate) return
    e.preventDefault()
    const min = getMins(e.clientY, colInfo.el)
    drag = { type:'create', date:colInfo.date, startMin:min, curMin:min, colEl:colInfo.el }
    showDragPreview(colInfo.el, min, min)
    showTimeTooltip(e.clientX, e.clientY, mToTime(min))
  }
}, { passive: false })

document.addEventListener('pointermove', function(e) {
  if(!drag) return
  e.preventDefault()

  if(drag.type === 'pending') {
    const curMin = getMins(e.clientY, drag.colEl)
    if(Math.abs(curMin - drag.startMin) >= 15) {
      clearTimeout(longPressTimer); longPressTimer = null
      drag = { type:'create', date:drag.date, startMin:drag.startMin, curMin, colEl:drag.colEl }
      showDragPreview(drag.colEl, drag.startMin, curMin)
    }
    return
  }

  if(drag.type === 'create') {
    drag.curMin = getMins(e.clientY, drag.colEl)
    showDragPreview(drag.colEl, drag.startMin, drag.curMin)
    const s=Math.min(drag.startMin,drag.curMin), en=Math.max(drag.startMin,drag.curMin)
    showTimeTooltip(e.clientX, e.clientY, `${mToTime(s)}–${mToTime(en)}`)
  } else if(drag.type === 'resize') {
    const entry = DB.entries.find(x=>x.id===drag.id)
    if(!entry) return
    const min = getMins(e.clientY, drag.colEl)
    if(drag.edge==='bottom') entry.endMinutes = Math.max(entry.startMinutes+15, min)
    else entry.startMinutes = Math.min(entry.endMinutes-15, min)
    renderEntryInPlace(entry)
    showTimeTooltip(e.clientX, e.clientY, drag.edge==='bottom'?mToTime(entry.endMinutes):mToTime(entry.startMinutes))
  } else if(drag.type === 'move') {
    const entry = DB.entries.find(x=>x.id===drag.id)
    if(!entry) return
    const colAtPoint = getColFromXY(e.clientX, e.clientY)
    if(colAtPoint) {
      const dayChanged = colAtPoint.date !== entry.date
      if(dayChanged) { entry.date = colAtPoint.date; drag.moved = true }
      drag.colEl = colAtPoint.el
      const curMin = getMins(e.clientY, drag.colEl)
      const delta = curMin - drag.clickMin
      if(Math.abs(delta) >= 15) drag.moved = true
      let newStart = clamp(drag.origStart + delta, START_HOUR*60, END_HOUR*60-drag.dur)
      if(DB.snapToGrid!==false) newStart = snap15(newStart)
      entry.startMinutes = newStart; entry.endMinutes = newStart + drag.dur
      if(dayChanged) { renderPreserveScroll(); drag.colEl = document.getElementById('col-'+entry.date) }
      else renderEntryInPlace(entry)
      showTimeTooltip(e.clientX, e.clientY, `${mToTime(entry.startMinutes)}–${mToTime(entry.endMinutes)}`)
    }
  }
}, { passive: false })

document.addEventListener('pointerup', function(e) {
  if(!drag) return
  if(longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null }
  document.body.style.cursor = ''
  removeDragPreview()
  hideTimeTooltip()

  if(drag.type === 'pending') {
    const entry = DB.entries.find(x=>x.id===drag.id)
    if(entry) { entry.startMinutes=drag.origStart; entry.endMinutes=drag.origEnd; entry.date=drag.origDate }
    const editId = drag.id; drag = null; render()
    showModal('edit', editId)
  } else if(drag.type === 'create') {
    const s = Math.min(drag.startMin, drag.curMin), end = Math.max(drag.startMin, drag.curMin)
    if(end - s >= 15) addEntry({ projectId:DB.selProject, taskTemplateId:DB.selTemplate, date:drag.date, startMinutes:s, endMinutes:end })
    else if(isTouchDevice()) addEntry({ projectId:DB.selProject, taskTemplateId:DB.selTemplate, date:drag.date, startMinutes:s, endMinutes:s+30 })
    drag = null; render()
  } else if(drag.type === 'resize') {
    const entry = DB.entries.find(x=>x.id===drag.id)
    if(entry && (entry.startMinutes!==drag.origStart || entry.endMinutes!==drag.origEnd)) { mergeOverlapping(drag.id); save() }
    else if(entry) { entry.startMinutes=drag.origStart; entry.endMinutes=drag.origEnd }
    drag = null; render()
  } else if(drag.type === 'move') {
    if(!drag.moved) {
      const entry = DB.entries.find(x=>x.id===drag.id)
      if(entry) { entry.startMinutes=drag.origStart; entry.endMinutes=drag.origEnd; entry.date=drag.origDate }
      const editId = drag.id; drag = null; render()
      showModal('edit', editId)
    } else {
      const entry = DB.entries.find(x=>x.id===drag.id)
      if(entry) pushHist({ t:'upd', id:drag.id, before:{startMinutes:drag.origStart, endMinutes:drag.origEnd, date:drag.origDate}, after:{startMinutes:entry.startMinutes, endMinutes:entry.endMinutes, date:entry.date} })
      mergeOverlapping(drag.id); save()
      drag = null; render()
    }
  } else drag = null
})

document.addEventListener('pointercancel', function() {
  if(longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null }
  hideTimeTooltip()
  if(drag) {
    if(drag.type==='move'||drag.type==='resize'||drag.type==='pending') {
      const entry = DB.entries.find(x=>x.id===drag.id)
      if(entry) { entry.startMinutes=drag.origStart; entry.endMinutes=drag.origEnd; if(drag.origDate) entry.date=drag.origDate }
    }
    drag = null; render()
  }
})

document.addEventListener('selectstart', e => { if(drag) e.preventDefault() })
document.addEventListener('contextmenu', function(e) {
  const entryEl = e.target.closest('[data-entry-id]')
  if(!entryEl) return
  e.preventDefault(); showCtxMenu(e.clientX, e.clientY, entryEl.dataset.entryId)

document.addEventListener('dblclick', function(e) {
  const entryEl = e.target.closest('[data-entry-id]')
  if(entryEl) { e.preventDefault(); showModal('edit', entryEl.dataset.entryId); return }
  // Double-click empty grid to create entry with preset project/task

    addEntry({ projectId:DB.selProject, taskTemplateId:DB.selTemplate, date:colEl.dataset.date, startMinutes:min, endMinutes:min+30 })
    render()
  }
})
document.addEventListener('keydown', function(e) {
  if(e.key==='Escape') { closeModal(); closeCtxMenu(); closeExportDialog(); closeShortcutsPanel() }
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();e.shiftKey?doRedo():doUndo()}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){e.preventDefault();doRedo()}
  if(e.key==='?' && !e.target.closest('input,select,textarea')) showShortcutsPanel()
})

function renderEntryInPlace(entry) {
  const el = document.querySelector(`[data-entry-id="${entry.id}"].entry-block`)
  if(!el) return
  el.style.top = ((entry.startMinutes-START_HOUR*60)/60)*HOUR_H + 'px'
  el.style.height = Math.max(((entry.endMinutes-entry.startMinutes)/60)*HOUR_H, 15) + 'px'
}

function showDragPreview(colEl, min1, min2) {
  let pv = colEl.querySelector('.drag-preview')
  if(!pv) { pv=document.createElement('div'); pv.className='drag-preview'; colEl.appendChild(pv) }
  const s=Math.min(min1,min2), e=Math.max(min1,min2)
  if(e-s < 15) { pv.style.display='none'; return }
  pv.style.display=''
  pv.style.top = ((s-START_HOUR*60)/60)*HOUR_H+'px'
  pv.style.height = ((e-s)/60)*HOUR_H+'px'
  const proj = DB.projects.find(p=>p.id===DB.selProject)
  if(proj) { pv.style.borderColor=proj.color; pv.style.background=`color-mix(in srgb,${proj.color} 10%,transparent)` }
}
function removeDragPreview() { document.querySelectorAll('.drag-preview').forEach(el=>el.remove()) }

// ── Reusable confirm/alert modal (replaces browser confirm() / alert()) ──
function showConfirmModal({ title, message, confirmLabel = 'Delete', danger = true, onConfirm, onCancel }) {
  const existing = document.getElementById('confirm-modal-root')
  if (existing) existing.remove()
  const div = document.createElement('div')
  div.className = 'modal-bg'; div.id = 'confirm-modal-root'
  const btnStyle = danger
    ? 'background:var(--danger);color:#fff;border-color:var(--danger)'
    : 'background:var(--primary);color:var(--primary-fg);border-color:var(--primary)'
  div.innerHTML = `
    <div class="modal-box" style="max-width:360px;text-align:center" onclick="event.stopPropagation()">
      <div style="font-size:22px;margin-bottom:8px">${danger ? '⚠️' : 'ℹ️'}</div>
      <h3 class="font-semibold text-sm mb-2">${esc(title)}</h3>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.5">${esc(message)}</p>
      <div class="flex gap-2 justify-center">
        <button class="btn" id="confirm-modal-cancel">${danger ? 'Cancel' : 'OK'}</button>
        ${danger ? `<button class="btn" id="confirm-modal-ok" style="${btnStyle}">${esc(confirmLabel)}</button>` : ''}
      </div>
    </div>`
  div.addEventListener('mousedown', e => { if (e.target === div) { div.remove(); onCancel?.() } })
  document.body.appendChild(div)
  div.querySelector('#confirm-modal-cancel').onclick = () => { div.remove(); onCancel?.() }
  const okBtn = div.querySelector('#confirm-modal-ok')
  if (okBtn) okBtn.onclick = () => { div.remove(); onConfirm?.() }
  setTimeout(() => (okBtn || div.querySelector('#confirm-modal-cancel'))?.focus(), 50)
}

// Delete project: removes project + all its entries (orphan cleanup)
window.confirmDeleteProject = (id) => {
  const p = DB.projects.find(x => x.id === id)
  if (!p) return
  const count = DB.entries.filter(x => x.projectId === id).length
  showConfirmModal({
    title: `Delete "${p.name}"?`,
    message: `This will permanently delete the project and ${count} time ${count === 1 ? 'entry' : 'entries'}. This cannot be undone.`,
    confirmLabel: 'Delete Project',
    onConfirm: () => {
      const removedEntries = DB.entries.filter(x => x.projectId === id).map(x => ({...x}))
      pushHist({ t: 'delProject', project: {...p}, entries: removedEntries })
      DB.projects = DB.projects.filter(x => x.id !== id)
      DB.entries = DB.entries.filter(x => x.projectId !== id)
      if (DB.selProject === id) DB.selProject = null
      save(); render()
    }
  })
}

// Delete template: removes template + all entries using it (orphan cleanup)
window.confirmDeleteTemplate = (id) => {
  const t = DB.templates.find(x => x.id === id)
  if (!t) return
  const count = DB.entries.filter(x => x.taskTemplateId === id).length
  showConfirmModal({
    title: `Delete task "${t.name}"?`,
    message: `This will permanently delete the task and ${count} time ${count === 1 ? 'entry' : 'entries'} using it.`,
    confirmLabel: 'Delete Task',
    onConfirm: () => {
      const removedEntries = DB.entries.filter(x => x.taskTemplateId === id).map(x => ({...x}))
      pushHist({ t: 'delTemplate', template: {...t}, entries: removedEntries })
      DB.templates = DB.templates.filter(x => x.id !== id)
      DB.entries = DB.entries.filter(x => x.taskTemplateId !== id)
      if (DB.selTemplate === id) DB.selTemplate = null
      save(); render()
    }
  })
}

window.clearWeek = () => {
  const dates = getDates()
  const removed = getVisibleEntries().filter(e => dates.includes(e.date))
  if (!removed.length) {
    showConfirmModal({ title: 'Nothing to clear', message: 'There are no entries in the current week.', danger: false })
    return
  }
  showConfirmModal({
    title: 'Clear this week?',
    message: `This will delete all ${removed.length} time ${removed.length === 1 ? 'entry' : 'entries'} from the current week view.`,
    confirmLabel: 'Clear Week',
    onConfirm: () => {
      pushHist({ t: 'clearWeek', entries: removed.map(e => ({...e})) })
      const ids = new Set(removed.map(e => e.id))
      DB.entries = DB.entries.filter(e => !ids.has(e.id))
      save(); render()
    }
  })
}

window.showProjectCtx = (e, id) => {
  closeCtxMenu()

function pickDistinctColor(palette) {
  const usedColors = DB.projects.map(p=>p.color.toLowerCase())
  if(usedColors.length===0) return palette[0]
  const available = palette.filter(c=>!usedColors.includes(c.toLowerCase()))
  if(available.length>0) return available[0]
  // All palette colors used — pick a hue maximally distant from existing
  const usedHues = usedColors.map(c=>hexToHsl(c)[0])
  let bestHue=0, bestDist=0
  for(let h=0;h<360;h+=15){ const minDist=Math.min(...usedHues.map(uh=>Math.min(Math.abs(h-uh),360-Math.abs(h-uh)))); if(minDist>bestDist){bestDist=minDist;bestHue=h} }
  return hslToHex(bestHue,70,50)
}

function hexToHsl(hex) {
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255
  const max=Math.max(r,g,b), min=Math.min(r,g,b), l=(max+min)/2
  let h=0, s=0
  if(max!==min){ const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min); if(max===r)h=((g-b)/d+(g<b?6:0))*60; else if(max===g)h=((b-r)/d+2)*60; else h=((r-g)/d+4)*60 }
  return [h,s*100,l*100]
}

function hslToHex(h,s,l) {
  s/=100; l/=100
  const a=s*Math.min(l,1-l), f=n=>{const k=(n+h/30)%12; return l-a*Math.max(Math.min(k-3,9-k,1),-1)}
  const toHex=x=>Math.round(x*255).toString(16).padStart(2,'0')
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`
}

let expState = null

function expDefault() {
  return { fileType:'pdf', outputBy:'daterange', preset:'today', startDate:toISO(new Date()), endDate:toISO(new Date()), selectedProjects:new Set(), selectedClients:new Set(), lastClickedIdx:null, groupByClient:false }
}

function expPresetDates(preset) {
  const today = new Date()
  if(preset==='today') return { start:toISO(today), end:toISO(today) }
  if(preset==='thisweek'){ const ws=startOfWeek(today); return { start:toISO(ws), end:toISO(addDays(ws,6)) } }
  if(preset==='thismonth'){ const ms=new Date(today.getFullYear(),today.getMonth(),1),me=new Date(today.getFullYear(),today.getMonth()+1,0); return { start:toISO(ms), end:toISO(me) } }
  if(preset==='all'){ const dates=DB.entries.map(e=>e.date).sort(); return { start:dates[0]||toISO(today), end:dates[dates.length-1]||toISO(today) } }
  return null
}

function expIsValid() {
  if(expState.outputBy==='daterange') return expState.startDate && expState.endDate && expState.startDate<=expState.endDate
  if(expState.outputBy==='client') return expState.selectedClients.size>0
  return expState.selectedProjects.size>0
}

function expGetError() {
  if(expState.outputBy==='daterange'){
    if(!expState.startDate||!expState.endDate) return 'Please enter both dates'
    if(expState.startDate>expState.endDate) return 'Start date must be before end date'
  }
  return ''
}

function doExportCSV(entries, suffix) {
  const sorted=[...entries].sort((a,b)=>a.date.localeCompare(b.date)||a.startMinutes-b.startMinutes)
  const rows = [['=== DETAIL ==='],['Date','Project','Client','Task','Start','End','Duration (min)','Notes','Tags']]
  sorted.forEach(e=>{ const p=DB.projects.find(x=>x.id===e.projectId),t=DB.templates.find(x=>x.id===e.taskTemplateId); rows.push([e.date,p?.name||'',p?.client||'',t?.name||'',mToTime(e.startMinutes),mToTime(e.endMinutes),e.endMinutes-e.startMinutes,e.notes,e.tags.join('; ')]) })
  rows.push([],[],['=== SUMMARY BY PROJECT ==='],['Project','Client','Total Hours'])
  const projTotals = new Map()
  sorted.forEach(e=>{ const p=DB.projects.find(x=>x.id===e.projectId); const key=p?.id||'unknown'; if(!projTotals.has(key)) projTotals.set(key,{name:p?.name||'?',client:p?.client||'',mins:0,tasks:new Map()}); const pt=projTotals.get(key); pt.mins+=e.endMinutes-e.startMinutes; const t=DB.templates.find(x=>x.id===e.taskTemplateId); pt.tasks.set(t?.name||'?',(pt.tasks.get(t?.name||'?')||0)+(e.endMinutes-e.startMinutes)) })
  for(const[,v] of projTotals) rows.push([v.name,v.client,(v.mins/60).toFixed(2)])
  rows.push([],[],['=== TASKS PER PROJECT ==='],['Project','Task','Total Hours'])
  for(const[,v] of projTotals){ for(const[task,mins] of v.tasks) rows.push([v.name,task,(mins/60).toFixed(2)]) }
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n')
  dl(csv, `time-report${suffix}-${toISO(new Date())}.csv`, 'text/csv')
}

  let html=`<!DOCTYPE html><html><head><title>Time Report</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:40px;max-width:900px;margin:auto;color:#333}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #ddd;padding:8px 12px;font-size:13px;text-align:left}th{background:#f7f7f8;font-size:11px;text-transform:uppercase;font-weight:600;color:#555}h1{font-size:20px;margin-bottom:4px}h2{font-size:15px;margin-top:28px;color:#444}.meta{color:#888;font-size:12px;margin-bottom:20px}tr:nth-child(even){background:#fafafa}@media print{body{padding:20px}}</style></head><body>`
  html+=`<h1>Time Report</h1><p class="meta">Generated ${new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p>`
  const grandTotal=[...projTotals.values()].reduce((s,v)=>s+v.mins,0)

  for(const[name,v] of projTotals){ const taskList=[...v.tasks.entries()].map(([t,m])=>`${t} (${fmtDur(m)})`).join(', '); html+=`<tr><td><strong>${esc(name)}</strong></td><td>${(v.mins/60).toFixed(2)}h</td><td style="font-size:12px;color:#666">${esc(taskList)}</td></tr>` }
  html+=`</table><h2>Detail</h2><table><tr><th>Date</th><th>Project</th><th>Task</th><th>Time</th><th>Duration</th><th>Notes</th></tr>`
  sorted.forEach(e=>{ const p=DB.projects.find(x=>x.id===e.projectId),t=DB.templates.find(x=>x.id===e.taskTemplateId); html+=`<tr><td>${e.date}</td><td>${esc(p?.name||'')}</td><td>${esc(t?.name||'')}</td><td>${mToTime(e.startMinutes)}–${mToTime(e.endMinutes)}</td><td>${fmtDur(e.endMinutes-e.startMinutes)}</td><td style="font-size:12px;color:#666">${esc(e.notes)}</td></tr>` })

  const exportDate = toISO(new Date())
  dl(html, `time-report${suffix}-${exportDate}.html`, 'text/html')
}

const CSV_PALETTE = ['#4f46e5','#0891b2','#16a34a','#ca8a04','#dc2626','#9333ea','#e11d48','#0d9488','#d97706','#6366f1','#ec4899','#14b8a6']

// ── CSV parsing ──────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n')
  const rows = []
  for(const line of lines) {
    if(!line.trim()) continue
    const cells = []; let cur = '', inQ = false
    for(let i = 0; i < line.length; i++) {
      const ch = line[i]
      if(ch === '"') { if(inQ && line[i+1]==='"') { cur+='"'; i++ } else inQ=!inQ }
      else if(ch === ',' && !inQ) { cells.push(cur.trim()); cur='' }
      else cur += ch
    }
    cells.push(cur.trim())
    rows.push(cells)
  }
  return rows
}

function csvRowsToObjects(rows) {
  if(rows.length < 2) return { headers: [], records: [] }
  const headers = rows[0].map(h => h.toLowerCase().trim())
  const records = rows.slice(1).map(row => {
    const obj = {}
    headers.forEach((h, i) => { obj[h] = (row[i] || '').trim() })
    return obj
  }).filter(r => Object.values(r).some(v => v !== ''))
  return { headers, records }
}

// ── Validation ───────────────────────────────────────────────
function validateProjectsCSV(records) {
  const errors = [], warnings = [], parsed = []
  for(let i = 0; i < records.length; i++) {
    const r = records[i], row = i + 2
    if(!r['project name'] && !r['name']) { errors.push(`Row ${row}: missing "project name"`); continue }
    const name = (r['project name'] || r['name']).trim()
    if(!name) { errors.push(`Row ${row}: project name is blank`); continue }
    let color = (r['color'] || '').trim()
    if(color && !/^#[0-9a-fA-F]{6}$/.test(color)) { warnings.push(`Row ${row}: invalid color "${color}", will auto-assign`); color = '' }
    parsed.push({ name, client: (r['client'] || '').trim(), color })
  }
  return { errors, warnings, parsed }
}

function validateTasksCSV(records) {
  const errors = [], warnings = [], parsed = []
  for(let i = 0; i < records.length; i++) {
    const r = records[i], row = i + 2
    if(!r['task name'] && !r['name']) { errors.push(`Row ${row}: missing "task name"`); continue }
    const name = (r['task name'] || r['name']).trim()
    if(!name) { errors.push(`Row ${row}: task name is blank`); continue }
    const tags = (r['tags'] || '').split(';').map(t=>t.trim()).filter(Boolean)
    parsed.push({ name, tags })
  }
  return { errors, warnings, parsed }
}

window.handleCsvDrop = (e) => {
  const file = e.dataTransfer.files?.[0]
  if(file) processCsvFile(file)
}

window.handleCsvFileInput = (input) => {
  const file = input.files?.[0]
  if(file) processCsvFile(file)
  input.value = ''
}

function processCsvFile(file) {
  csvImportState.file = file.name
  const reader = new FileReader()
  reader.onload = e => {
    const text = e.target.result
    const rows = parseCSV(text)
    const { records } = csvRowsToObjects(rows)
    if(!records.length) {
      csvImportState.errors = ['No data rows found. Make sure the file has a header row and at least one data row.']
      csvImportState.parsed = null
      renderCsvImportDialog(); return
    }
    const { errors, warnings, parsed } = csvImportState.tab === 'projects'
      ? validateProjectsCSV(records)
      : validateTasksCSV(records)
    csvImportState.errors = errors
    csvImportState.warnings = warnings
    csvImportState.parsed = parsed.length ? parsed : null
    renderCsvImportDialog()
  }
  reader.readAsText(file)
}

window.commitCsvImport = () => {
  const { tab, parsed, mergeMode } = csvImportState
  if(!parsed || !parsed.length) return

  if(tab === 'projects') {
    if(mergeMode === 'replace') DB.projects = []
    for(const p of parsed) {
      const exists = DB.projects.find(x => x.name.toLowerCase() === p.name.toLowerCase() && (x.client||'').toLowerCase() === (p.client||'').toLowerCase())
      if(exists) continue
      const color = p.color || pickDistinctColor(CSV_PALETTE)
      DB.projects.push({ id: uid(), name: p.name, client: p.client || '', color, status: 'active' })
    }
  } else {
    if(mergeMode === 'replace') DB.templates = []
    for(const t of parsed) {
      const exists = DB.templates.find(x => x.name.toLowerCase() === t.name.toLowerCase())
      if(exists) continue
      DB.templates.push({ id: uid(), name: t.name, tags: t.tags })
    }
  }
  save(); render(); closeCsvImportDialog()
  const noun = tab === 'projects' ? 'projects' : 'tasks'
  showConfirmModal({ title: 'Import complete', message: `Successfully imported ${parsed.length} ${noun}.`, danger: false })
}

// ═══════════════════════════════════════════════════════════════
// AUTOSAVE
// ═══════════════════════════════════════════════════════════════
const AUTOSAVE_INTERVAL_MS = 5 * 60 * 1000 // 5 minutes
let autosaveTimer = null

function doAutosave() {
  const payload = JSON.stringify({
    projects: DB.projects,
    templates: DB.templates,
    entries: DB.entries,
    preferences: { theme: DB.theme, view: DB.view },
    autosavedAt: new Date().toISOString()
  }, null, 2)
  const b = new Blob([payload], { type: 'application/json' })
  const u = URL.createObjectURL(b)
  const a = document.createElement('a')
  a.href = u
  a.download = 'time-tracker-autosave.json'
  a.click()
  setTimeout(() => URL.revokeObjectURL(u), 1000)
  DB.lastAutosave = Date.now()
  save()
}

function startAutosave() {
  stopAutosave()
  autosaveTimer = setInterval(doAutosave, AUTOSAVE_INTERVAL_MS)
}

function stopAutosave() {
  if (autosaveTimer) { clearInterval(autosaveTimer); autosaveTimer = null }
}

window.toggleAutosave = () => {
  DB.autosave = !DB.autosave
  if (DB.autosave) startAutosave()
  else stopAutosave()
  save()
  render()
}

function updateLastSavedDisplay() {
  const el = document.getElementById('last-saved-ts')
  if (!el) return
  const ts = DB.lastSaved
  if (!ts) { el.textContent = 'Never'; return }
  const d = new Date(ts)
  const pad = n => String(n).padStart(2, '0')
  el.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`
  // Also note last autosave if enabled
  const ael = document.getElementById('last-autosave-ts')
  if (ael) {
    if (!DB.lastAutosave) { ael.textContent = 'Not yet'; return }
    const ad = new Date(DB.lastAutosave)
    ael.textContent = `${pad(ad.getHours())}:${pad(ad.getMinutes())}:${pad(ad.getSeconds())}`
  }
}

// ═══════════════════════════════════════════════════════════════
// TIMER (with auto-save and auto-stop)
// ═══════════════════════════════════════════════════════════════
let timerStart = null, timerInterval = null

function loadTimerState() {
  try {
    const saved = localStorage.getItem(TIMER_KEY)
    if(saved) {
      const t = JSON.parse(saved)
      timerStart = t.start
      if(t.projectId) DB.selProject = t.projectId
      if(t.templateId) DB.selTemplate = t.templateId
      timerInterval = setInterval(updateTimerDisplay, 1000)
    }
  } catch{}
}
function saveTimerState() {
  if(timerStart) localStorage.setItem(TIMER_KEY, JSON.stringify({start:timerStart, projectId:DB.selProject, templateId:DB.selTemplate}))
  else localStorage.removeItem(TIMER_KEY)
}

window.startTimer = () => {
  if(!DB.selProject || !DB.selTemplate) {
    showConfirmModal({ title: 'Select a project and task', message: 'Please select a project and a task from the sidebar before starting the timer.', danger: false })
    return
  }
  timerStart = Date.now()
  saveTimerState()
  timerInterval = setInterval(updateTimerDisplay, 1000)
  // Swap toolbar button without full re-render
  const startBtn = document.querySelector('button[onclick="startTimer()"]')
  if (startBtn) {
    startBtn.outerHTML = `<span id="timer-display" class="text-xs font-mono text-muted mr-1">00:00:00</span><button class="btn btn-sm" onclick="stopTimer()" style="color:var(--danger);border-color:var(--danger)">⏹ Stop</button>`
  } else {
    render()
  }
}
window.stopTimer = () => {
  if(!timerStart) return
  const startDate = new Date(timerStart), endDate = new Date()
  const date = toISO(startDate)
  const startMin = startDate.getHours()*60 + startDate.getMinutes()
  let endMin = endDate.getHours()*60 + endDate.getMinutes()
  // Cap at midnight
  endMin = Math.min(endMin, 23*60+59)
  if(endMin - startMin >= 1) {
    addEntry({ projectId:DB.selProject, taskTemplateId:DB.selTemplate, date, startMinutes:startMin, endMinutes:endMin })
  }
  clearInterval(timerInterval); timerInterval = null; timerStart = null
  document.title = 'TimeTracker'
  saveTimerState()
  render()
}

function updateTimerDisplay() {
  if(!timerStart) return
  const now = Date.now()
  const elapsedMs = now - timerStart
  const elapsedMins = elapsedMs / 60000

  // Auto-stop: 8 hours or 11:59pm
  const nowDate = new Date()
  const nowMins = nowDate.getHours() * 60 + nowDate.getMinutes()
  if(elapsedMins >= MAX_TIMER_MINS || nowMins >= 23*60+59) {
    stopTimer()
    return
  }

  const elapsed = Math.floor(elapsedMs / 1000)
  const h = Math.floor(elapsed/3600), m = Math.floor((elapsed%3600)/60), s = elapsed%60
  const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
  const el = document.getElementById('timer-display')
  if(el) el.textContent = timeStr
  // #5: update tab title so the timer is visible from any tab
  document.title = `⏱ ${timeStr} — TimeTracker`
}

// ═══════════════════════════════════════════════════════════════
// PROJECT TOOLTIP
// ═══════════════════════════════════════════════════════════════
let _tooltipEl = null
window.showProjTooltip = (e, text) => {
  if(!_tooltipEl) {
    _tooltipEl = document.createElement('div')
    _tooltipEl.className = 'proj-tooltip'
    document.body.appendChild(_tooltipEl)
  }
  _tooltipEl.textContent = text
  _tooltipEl.classList.add('visible')
  _positionTooltip(e)
}
window.hideProjTooltip = () => { if(_tooltipEl) _tooltipEl.classList.remove('visible') }
function _positionTooltip(e) {
  if(!_tooltipEl) return
  const x = e.clientX + 12, y = e.clientY - 28
  _tooltipEl.style.left = Math.min(x, window.innerWidth - 240) + 'px'
  _tooltipEl.style.top = Math.max(4, y) + 'px'
}

// ═══════════════════════════════════════════════════════════════
// SIDEBAR RESIZE
// ═══════════════════════════════════════════════════════════════
;(function initSidebarResize() {
  const MIN_W = 180, MAX_W = 480
  let resizing = false, startX = 0, startW = 0

  document.addEventListener('pointerdown', e => {
    const handle = e.target.closest('#sidebar-resize-handle')
    if(!handle) return
    e.preventDefault()
    resizing = true
    startX = e.clientX
    startW = document.getElementById('sidebar')?.offsetWidth || DB.sidebarWidth || 256
    handle.classList.add('dragging')
    document.body.style.cursor = 'col-resize'
    document.body.style.userSelect = 'none'
  })

  document.addEventListener('pointermove', e => {
    if(!resizing) return
    const delta = e.clientX - startX
    const newW = Math.min(MAX_W, Math.max(MIN_W, startW + delta))
    const sidebar = document.getElementById('sidebar')
    if(sidebar) sidebar.style.width = newW + 'px'
  })

  document.addEventListener('pointerup', e => {
    if(!resizing) return
    resizing = false
    document.body.style.cursor = ''
    document.body.style.userSelect = ''
    document.getElementById('sidebar-resize-handle')?.classList.remove('dragging')
    const sidebar = document.getElementById('sidebar')
    if(sidebar) {
      DB.sidebarWidth = sidebar.offsetWidth
      save()
    }
  })
})()

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
if(!DB.panelsCollapsed) DB.panelsCollapsed = {}
if(DB.filterProject === undefined) DB.filterProject = false
document.documentElement.classList.toggle('dark', DB.theme==='dark')
loadTimerState()
if(DB.autosave) startAutosave()
window.addEventListener('beforeunload', e => { if(histStack.length||timerStart){e.preventDefault();e.returnValue=''} })
render()
</script>
